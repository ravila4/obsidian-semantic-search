[project]
name = "obsidian-semantic"
version = "0.1.0"
description = "Semantic search for Obsidian vaults"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ricardo Avila", email = "ravila@protonmail.com" }]
keywords = ["obsidian", "semantic-search", "embeddings", "vector-search", "lancedb", "ollama", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.9",
    "lancedb>=0.5",
    "httpx>=0.27",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "mcp>=1.26.0",
    "rich>=13.0",
]

[project.optional-dependencies]
gemini = [
    "google-generativeai>=0.5",
]
dev = ["pytest>=8.0", "pytest-cov>=4.0", "ruff>=0.1"]

[project.urls]
Homepage = "https://github.com/ravila4/obsidian-semantic-search"
Repository = "https://github.com/ravila4/obsidian-semantic-search"
Issues = "https://github.com/ravila4/obsidian-semantic-search/issues"

[project.scripts]
obsidian-semantic = "obsidian_semantic.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_semantic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
